name: Verify Omartillery
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install test tools
        run: pacman -Syu --noconfirm nodejs qt6-declarative qt6-multimedia ttf-dejavu git shellcheck
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check ballistics, campaign balance, packaging and game flows
        run: bash scripts/check.sh
