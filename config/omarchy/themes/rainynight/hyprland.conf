# ────────────────────────────────────────────────────────────
# Omarchy Theme for Hyprland
# ────────────────────────────────────────────────────────────

general {
    col.active_border = rgb(303463)
    col.inactive_border = rgb(1a1b26)
    border_size = 2
    gaps_in = 2
    gaps_out = 4
}

animations {
animations {
    enabled = yes

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0, 0.35, 1

    animation = windows,     1, 5, easeOutQuint
    animation = windowsIn,   1, 5, easeOutQuint, popin 85%
    animation = windowsOut,  1, 4, easeInOutCubic, popin 85%

    animation = windowsMove, 1, 5, easeOutQuint

    animation = fade,        1, 5, easeInOutCubic
    animation = fadeIn,      1, 5, easeInOutCubic
    animation = fadeOut,     1, 4, easeInOutCubic

    animation = layers,      1, 4, easeOutQuint
    animation = layersIn,    1, 4, easeOutQuint
    animation = layersOut,   1, 3, easeInOutCubic

    animation = border,      1, 5, easeOutQuint
    animation = workspaces,  1, 6, easeOutQuint, slide
}

decoration {
    rounding = 14
    shadow {
        enabled = false
        range = 15
        render_power = 5
        offset = 0 0
    }
    blur {
        enabled = true
        size = 1
        passes = 4
        contrast = 1.1
        brightness = 1.1
        vibrancy = 0.2
        vibrancy_darkness = 0.2
        noise = 0.03
        ignore_opacity = true
        new_optimizations = on
    }
    active_opacity = 0.93
    inactive_opacity = 0.92
    fullscreen_opacity = 1.0
}

layerrule = blur on, match:namespace walker
layerrule = ignore_alpha 0, match:namespace walker
layerrule = blur on, match:namespace waybar
layerrule = blur on, match:namespace notifications
layerrule = ignore_alpha 0, match:namespace notifications
layerrule = blur on, match:namespace vicinae
layerrule = blur on, match:namespace swayosd
layerrule = ignore_alpha 0.5, match:namespace swayosd
layerrule = ignore_alpha 0.1, match:namespace waybar
layerrule = ignore_alpha 0.1, match:namespace vicinae