# cava config for the nismo.visualizer bar widget.
#
# method = raw emits one byte per bar per frame on stdout, which is what the
# QML widget parses. Do not change bit_format to 16 without also updating the
# byte handling in Visualizer.qml.
#
# device is the monitor of the current default sink. Visualizer.qml resolves
# this name at runtime and injects it via a generated copy of this file, so the
# placeholder below is only used if that resolution fails.

[general]
# MUST stay in sync with `barCount` in
# ~/.config/omarchy/plugins/nismo.visualizer/Visualizer.qml. The QML side splits
# each line of output into barCount values, so a mismatch desyncs every bar.
bars = 24
sensitivity = 1.6
framerate = 60
bit_format = 8

[output]
method = raw

[input]
device = @DEFAULT_MONITOR@
sample_rate = 48000
channels = 2