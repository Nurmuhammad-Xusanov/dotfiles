## The AMD ACP (Strix Point) SoundWire machine driver card is enumerated by
## alsa-ucm-independent PCMs; the ACP plugin does not expose any node for it.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.pci-0000_c1_00.5.*"
      }
      {
        alsa.card_name = "amd-soundwire"
      }
      {
        api.alsa.card.name = "amd-soundwire"
      }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = false
        api.alsa.use-ucm = false
      }
    }
  }
]
