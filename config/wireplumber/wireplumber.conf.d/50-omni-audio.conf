## HP OmniBook X Flip 8EA1 (Strix Point, ACP 7.2 + SoundWire RT712-VB + TAS2783)
##
## 1) Yashiriladigan yagona qurilma:
##    - alsa_input...capture.3.0 = SDW0-PIN4 SmartAmp multicodec capture
##      (PCM ochilmaydi: snd_soc_open() -EINVAL, fayl yaratilmaydi).
##      Bu butun "laptop mikrofoni"ning o'lim sababi edi, shuning uchun yashirilgan.
##
## 2) Nomi o'zgartiriladigan qurilmalar (3.5 mm, ichki mikrofon, dinamkalar).
##    3.5 mm quloq chiqishi (playback.0.0) YA SIRG'A qoldirilgan: endi u har doim
##    ko'rinadi, quloqni ulaganingizda Quick Settings'da "Headphones (3.5 mm)"
##    paydo bo'ladi va undan ovoz chiqadi.

monitor.alsa.rules = [
  ## 3.5 mm quloq chiqishi (faqat nomi)
  ## node.passive = true -> ko'rinadi, lekin WirePlumber uni avtomatik
  ## "default sink" qilib TAYINLAMAYDI (drayver uni 1728 prioritet bilan
  ## dinamiklarga beradi, shuning uchun quloq ulanmaganda ovoz yo'q bo'lib
  ## qolardi). Quloqni ulanganda qo'lda tanlansiz.
  {
    matches = [
      { node.name = "~^alsa_output\\.pci-0000_c1_00\\.5-platform-amd_sdw\\.playback\\.0\\.0$" }
    ]
    actions = {
      update-props = {
        node.nick = "Headphones (3.5 mm)"
        node.description = "Headphones (3.5 mm)"
        node.passive = true
      }
    }
  }
  ## Buzilgan SmartAmp capture (ochilmaydi)
  {
    matches = [
      { node.name = "~^alsa_input\\.pci-0000_c1_00\\.5-platform-amd_sdw\\.capture\\.3\\.0$" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
  ## Ichki mikrofon (SmartMic, SDW1-PIN5) - drayverda MUTE bo'lib qoladi,
  ## ~/.local/bin/mic-unmute ishlayotgan paytdan keyin signal beradi.
  {
    matches = [
      { node.name = "~^alsa_input\\.pci-0000_c1_00\\.5-platform-amd_sdw\\.capture\\.4\\.0$" }
    ]
    actions = {
      update-props = {
        node.nick = "Internal microphone"
        node.description = "Internal microphone (RT712 SmartMic)"
      }
    }
  }
  ## Dinagalkalar nomi
  {
    matches = [
      { node.name = "~^alsa_output\\.pci-0000_c1_00\\.5-platform-amd_sdw\\.playback\\.2\\.0$" }
    ]
    actions = {
      update-props = {
        node.nick = "Laptop speakers"
        node.description = "Laptop speakers"
      }
    }
  }
  ## Quloqdagi mikrofon (3.5 mm) nomi
  {
    matches = [
      { node.name = "~^alsa_input\\.pci-0000_c1_00\\.5-platform-amd_sdw\\.capture\\.1\\.0$" }
    ]
    actions = {
      update-props = {
        node.nick = "Headset microphone (3.5 mm)"
        node.description = "Headset microphone (3.5 mm)"
      }
    }
  }
  ## Karta nomi
  {
    matches = [
      { device.name = "~^alsa_card\\.pci-0000_c1_00\\.5-platform-amd_sdw$" }
    ]
    actions = {
      update-props = {
        device.nick = "Built-in audio"
        device.description = "Built-in audio (Realtek RT712)"
      }
    }
  }
]