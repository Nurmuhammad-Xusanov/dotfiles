general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = pidof hyprlock || hyprlock
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Locking and the screensaver are handled by the Omarchy shell idle service
# (idle.screensaver / idle.lock in ~/.config/omarchy/shell.json), which already
# honours the bar's "Stay Awake" toggle. hypridle only turns the display off and
# suspends, and both run through idle-guard.sh so that toggle also prevents
# sleep and screen-off.
#
# Omarchy locks at 300s (idle.lock), so suspending at 420s sleeps the laptop
# 2 minutes after it locked, provided nobody has touched it since.

listener {
    timeout = 330
    on-timeout = $HOME/.config/hypr/scripts/idle-guard.sh hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 420
    on-timeout = $HOME/.config/hypr/scripts/idle-guard.sh systemctl suspend
}
